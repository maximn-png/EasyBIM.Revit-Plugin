<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- element box currently sitting near the level above -->
  <rect x="12" y="3" width="8" height="6" rx="1" stroke="#2A4B7C" stroke-width="2.1" stroke-linejoin="round"/>

  <!-- dashed line = the level above (not the true baseline) -->
  <path d="M4 9 H11 M21 9 H28" stroke="#2A4B7C" stroke-width="2.1" stroke-linecap="round"/>

  <!-- arrow snapping the element straight down to its real floor level -->
  <path d="M16 10 V22" stroke="#2A4B7C" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M11.5 18 L16 23.2 L20.5 18" stroke="#2A4B7C" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- solid baseline = the correct floor/level -->
  <path d="M3 27 H29" stroke="#2A4B7C" stroke-width="2.6" stroke-linecap="round"/>
</svg>
